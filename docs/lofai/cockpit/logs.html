<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>主機A 日誌查詢</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Fira+Sans:wght@400;500;600&family=Noto+Sans+TC:wght@400;500&display=swap">
<style>
:root{
  --bg:#0B1017;--panel:#111923;--panel2:#0E151E;--line:#1E2A38;--line2:#2A3848;
  --text:#E6EDF3;--muted:#8A9AAD;--dim:#5C6B7C;
  --accent:#5AA9FF;--accent2:#2E5C99;--amber:#F2B640;
  --good:#3DD68C;--warn:#F2B640;--crit:#FF5C5C;--info:#9B8CFF;
  --mono:'Fira Code','JetBrains Mono',ui-monospace,Menlo,monospace;
  --sans:'Fira Sans','Noto Sans TC','PingFang TC',system-ui,sans-serif;
  --r:6px;
}
*{box-sizing:border-box}
html{color-scheme:dark;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 var(--sans);padding-block:16px 32px;padding-inline:20px}
h1,h2,h3{margin:0;font-weight:600}
.wrap{max-width:1400px;margin:0 auto;display:grid;gap:12px}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.brand h1{font-size:18px}
.brand .sub{color:var(--muted);font-family:var(--mono);font-size:12px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:500;border:1px solid var(--line2);color:var(--muted);font-family:var(--mono);text-decoration:none}
.pill.b{color:var(--accent);border-color:var(--accent2);background:rgba(90,169,255,.08)}
a.pill:hover{border-color:var(--accent)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel h3{font-size:11px;color:var(--muted);letter-spacing:.8px;text-transform:uppercase;display:flex;justify-content:space-between}
.panel h3 span{font-family:var(--mono);font-weight:400;color:var(--dim);letter-spacing:0;text-transform:none}
form{display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) auto;gap:10px;align-items:end}
label{display:grid;gap:4px;font-size:11px;color:var(--muted);letter-spacing:.6px;text-transform:uppercase}
select,input,button{font:13px var(--sans);color:var(--text);background:var(--panel2);border:1px solid var(--line2);border-radius:4px;padding:7px 10px;min-height:38px}
input{font-family:var(--mono)}
select:focus,input:focus,button:focus{outline:2px solid var(--accent);outline-offset:1px}
button{cursor:pointer;background:rgba(90,169,255,.12);border-color:var(--accent2);color:var(--accent);font-weight:500}
button:hover{border-color:var(--accent)}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{color:var(--muted);font-weight:500;text-align:left;font-size:11px;letter-spacing:.6px;text-transform:uppercase;padding:0 10px 7px 0;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:6px 10px 6px 0;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.t{font-family:var(--mono);color:var(--muted);white-space:nowrap}
td.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
td.txt{font-family:var(--mono);font-size:12px;overflow-wrap:anywhere;min-width:280px}
.tag{font-size:11px;padding:1px 6px;border-radius:3px;border:1px solid;font-family:var(--mono);text-align:center;display:inline-block}
.tag.info{color:var(--info);border-color:rgba(155,140,255,.4)}.tag.warn{color:var(--warn);border-color:rgba(242,182,64,.5)}.tag.crit{color:var(--crit);border-color:rgba(255,92,92,.5)}.tag.good{color:var(--good);border-color:rgba(61,214,140,.4)}
.empty{color:var(--dim);font-size:12.5px;padding:6px 0}
.note{font-size:12px;color:var(--muted)}
mark{background:rgba(242,182,64,.25);color:inherit;border-radius:2px}
@media (max-width:760px){
  body{padding-inline:16px}
  form{grid-template-columns:1fr 1fr}
  form button{grid-column:1/3}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>主機A 日誌查詢</h1>
      <span class="sub" id="sub">事件與請求保留 30 天；伺服器日誌與核心訊息讀現況</span>
    </div>
    <a class="pill b" href="/">‹ 回駕駛台</a>
  </header>

  <section class="panel">
    <form id="f" onsubmit="return false">
      <label>來源
        <select id="src">
          <option value="events">事件（重啟、切備援、錯誤）</option>
          <option value="requests">請求（每筆推論）</option>
          <option value="server">伺服器日誌（llama-server）</option>
          <option value="dmesg">核心訊息（dmesg）</option>
        </select>
      </label>
      <label>時間範圍
        <select id="range">
          <option value="86400">最近 24 小時</option>
          <option value="604800">最近 7 天</option>
          <option value="2592000">最近 30 天</option>
          <option value="0">全部</option>
        </select>
      </label>
      <label>關鍵字<input id="q" placeholder="例如 Xid、CUDA error、備援" autocomplete="off"></label>
      <label>最多列數
        <select id="limit"><option>100</option><option selected>200</option><option>500</option></select>
      </label>
      <button id="go" type="submit">查詢</button>
    </form>
    <div class="note" id="note"></div>
  </section>

  <section class="panel">
    <h3>結果 <span id="count">—</span></h3>
    <div class="tw"><table id="tbl"><thead id="th"></thead><tbody id="tb"></tbody></table></div>
    <div class="empty" id="empty" hidden>沒有符合的紀錄</div>
  </section>
</div>

<script>
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
  const pad = n => String(n).padStart(2, '0');
  const fmt = ts => { const d = new Date(ts * 1000); return `${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`; };
  const lv = {info: '資訊', warn: '警告', crit: '錯誤', good: '恢復'};
  const hi = (text, q) => { const t = esc(text); if (!q) return t; const i = t.toLowerCase().indexOf(esc(q).toLowerCase()); return i < 0 ? t : t.slice(0, i) + '<mark>' + t.slice(i, i + q.length) + '</mark>' + t.slice(i + q.length); };

  const heads = {
    events: ['時間', '層級', '來源', '內容'],
    requests: ['時間', '上下文', '快取命中', '新讀入', '讀取 tok/s', '首字秒', '生成 tok', '生成 tok/s', 'MTP 接受'],
    server: ['內容'],
    dmesg: ['時間', '內容'],
  };
  const rowFns = {
    events: (r, q) => `<td class="t">${fmt(r.ts)}</td><td><span class="tag ${r.level}">${lv[r.level] || esc(r.level)}</span></td><td class="t">${r.kind === 'host' ? '主機' : '模型'}</td><td class="txt">${hi(r.text, q)}</td>`,
    requests: r => `<td class="t">${fmt(r.ts)}</td><td class="num">${(r.n_ctx_used ?? 0).toLocaleString()}</td><td class="num">${(r.cached ?? 0).toLocaleString()}</td><td class="num">${(r.prompt ?? 0).toLocaleString()}</td><td class="num">${r.prefill_tps?.toFixed(0) ?? '—'}</td><td class="num">${r.ttft_s?.toFixed(1) ?? '—'}</td><td class="num">${r.gen ?? '—'}</td><td class="num">${r.tps?.toFixed(1) ?? '—'}</td><td class="num">${r.accept != null ? (r.accept * 100).toFixed(0) + '%' : '—'}</td>`,
    server: (r, q) => `<td class="txt">${hi(r.text, q)}</td>`,
    dmesg: (r, q) => `<td class="t">${fmt(r.ts)}</td><td class="txt">${hi(r.text, q)}</td>`,
  };

  async function run() {
    const src = $('src').value, q = $('q').value.trim(), range = Number($('range').value), limit = $('limit').value;
    const since = range ? Math.floor(Date.now() / 1000) - range : 0;
    $('go').disabled = true; $('count').textContent = '查詢中…';
    try {
      const r = await fetch(`/api/logs?src=${src}&q=${encodeURIComponent(q)}&since=${since}&limit=${limit}`, {cache: 'no-store'});
      const d = await r.json();
      const rows = d.rows || [];
      $('th').innerHTML = '<tr>' + heads[src].map(h => `<th>${h}</th>`).join('') + '</tr>';
      $('tb').innerHTML = rows.map(x => `<tr>${rowFns[src](x, q)}</tr>`).join('');
      $('empty').hidden = rows.length > 0;
      $('count').textContent = `${rows.length} 筆${rows.length >= Number(limit) ? '（已達上限，縮小範圍或加關鍵字）' : ''}`;
      $('note').textContent = d.note || '';
    } catch (e) {
      $('count').textContent = '查詢失敗'; $('note').textContent = '收集器沒有回應';
    }
    $('go').disabled = false;
  }
  $('f').addEventListener('submit', run);
  $('src').addEventListener('change', () => { $('range').disabled = $('src').value === 'server'; run(); });
  run();
</script>
</body>
</html>
